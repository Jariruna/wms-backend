server:
  error:
    include-stacktrace: always

spring:
  application:
    name: wms-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Configuración de Springdoc Swagger UI
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
    api-docs:
      path: /v3/api-docs
    override-with-generic-response: false
    auto-tag-classes: false
  logging:
    level:
      org.springframework.web: DEBUG
      org.springdoc: DEBUG
      io.swagger.v3: DEBUG
